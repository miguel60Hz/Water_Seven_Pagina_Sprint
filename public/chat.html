<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Seven - Chat</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="/public/css/chat.css">
</head>
<body>

<header class="navbar">

    <div class="logo">
        <img src="imagenes/logo.png">
        <div><h1>Water Seven</h1></div>
    </div>

    <nav>
        <span class="badge"><a href="index.html">Inicio</a></span> 
        <span class="badge"><a href="comunidad.html">Comunidad</a></span> 
        <span class="badge"><a href="chat.html">Chat</a></span>
    </nav>

    <button class="nav-toggle" id="navToggle" type="button" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>

    <div class="auth" id="authSection">
        <a href="login.html"><button class="btn-outline">Iniciar sesión</button></a>
        <a href="registro.html"><button class="btn-primary">Registrarse</button></a>
    </div>
</header>

<section class="page">
    <h1>Chat</h1>

    <div class="chat-box" id="chatBox"></div>

    <div class="chat-form">
        <input id="mensaje" class="chat-input" placeholder="Mensaje...">
        <button class="btn-enviar" onclick="enviarMensaje()">Enviar</button>
    </div>
</section>

<script src="js/nav.js"></script>
<script src="js/api.js"></script>
<script>
let usuario = JSON.parse(localStorage.getItem("usuario"));

async function cargarMensajes() {
    try {
        const mensajes = await api.obtenerMensajes();
        const chat = document.getElementById("chatBox");
        chat.innerHTML = "";
        mensajes.forEach(m => {
            chat.innerHTML += `<p><strong>${m.remitente_nombre || 'Anónimo'}:</strong> ${m.contenido}</p>`;
        });
        chat.scrollTop = chat.scrollHeight;
    } catch (e) {
        console.error("Error al cargar mensajes:", e);
    }
}

async function enviarMensaje() {
    const input = document.getElementById("mensaje");

    if (!usuario) { alert("Debes iniciar sesión para chatear"); return; }
    if (input.value.trim() === "") return;

    try {
        await api.enviarMensaje(usuario.id, input.value);
        input.value = "";
        await cargarMensajes();
    } catch (e) {
        alert(e.message);
    }
}

setInterval(cargarMensajes, 5000);
cargarMensajes();
</script>
</body>
</html>
