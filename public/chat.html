<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Water Seven - Chat</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .page h1 {
            text-align: center;
        }

        .chat-box {
            width: 80%;
            height: 350px;
            margin: 20px auto;
            padding: 10px;
            border: 1px solid #c8e0e0;
            border-radius: 5px;
            overflow-y: auto;
            background-color: #f0f6f6;
        }

        .chat-input {
            width: 70%;
            padding: 10px;
            margin-left: 10%;
            border: 1px solid #c8e0e0;
            border-radius: 8px;
            outline: none;
        }

        .chat-input:focus {
            border-color: #3dadae;
        }

        button {
            padding: 10px;
            margin-left: 10px;
            cursor: pointer;
        }

        .chat-box p {
            margin: 5px 0;
        }

        .chat-box p strong {
            color: #3dadae;
        }

        .btn-enviar {
            background: #5ec4c5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
        }

        .btn-enviar:hover {
            background: #4ab0b1;
        }
    </style>
</head>
<body>

<header class="navbar">

    <div class="logo">
        <img src="imagenes/logo.png">
        <div><h1>Water Seven</h1></div>
    </div>

    <nav>
        <span class="badge"><a href="index.html">Inicio</a></span> 
        <span class="badge"><a href="comunidad.html">Comunidad</a></span> 
        <span class="badge"><a href="chat.html">Chat</a></span>
    </nav>

    <div class="auth" id="authSection">
        <a href="login.html"><button class="btn-outline">Iniciar sesión</button></a>
        <a href="registro.html"><button class="btn-primary">Registrarse</button></a>
    </div>
</header>

<section class="page">
    <h1>Chat</h1>

    <div class="chat-box" id="chatBox"></div>

    <div style="text-align:center;">
        <input id="mensaje" class="chat-input" placeholder="Mensaje...">
        <button class="btn-enviar" onclick="enviarMensaje()">Enviar</button>
    </div>
</section>

<script>
(function(){
    const u = JSON.parse(localStorage.getItem("usuario"));
    if (u) {
        document.getElementById("authSection").innerHTML = `
            <span style="margin-right:12px;color:#4a6b6b;">👤 ${u.nombre}</span>
            <button class="btn-outline" onclick="localStorage.removeItem('usuario');location.reload()">Cerrar sesión</button>
        `;
    }
})();
</script>
<script src="js/api.js"></script>
<script>
let usuario = JSON.parse(localStorage.getItem("usuario"));

async function cargarMensajes() {
    try {
        const mensajes = await api.obtenerMensajes();
        const chat = document.getElementById("chatBox");
        chat.innerHTML = "";
        mensajes.forEach(m => {
            chat.innerHTML += `<p><strong>${m.remitente_nombre || 'Anónimo'}:</strong> ${m.contenido}</p>`;
        });
        chat.scrollTop = chat.scrollHeight;
    } catch (e) {
        console.error("Error al cargar mensajes:", e);
    }
}

async function enviarMensaje() {
    const input = document.getElementById("mensaje");

    if (!usuario) { alert("Debes iniciar sesión para chatear"); return; }
    if (input.value.trim() === "") return;

    try {
        await api.enviarMensaje(usuario.id, input.value);
        input.value = "";
        await cargarMensajes();
    } catch (e) {
        alert(e.message);
    }
}

setInterval(cargarMensajes, 5000);
cargarMensajes();
</script>
</body>
</html>
