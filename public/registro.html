<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Water Seven - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: url("imagenes/fondo-auth.jpg") no-repeat center center fixed;
            background-size: cover;
        }

        .form-container {
            background: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body><header class="navbar">

    <div class="logo">
        <img src="imagenes/logo.png">
        <div><h1>Water Seven</h1></div>
    </div>

    <nav>
        <span class="badge"><a href="index.html">Inicio</a></span> 
        <span class="badge"><a href="comunidad.html">Comunidad</a></span> 
        <span class="badge"><a href="chat.html">Chat</a></span>
    </nav>

    <div class="auth" id="authSection">
        <a href="login.html"><button class="btn-outline">Iniciar sesión</button></a>
        <a href="registro.html"><button class="btn-primary">Registrarse</button></a>
    </div>
</header>
<script>
(function(){
    const usuario = JSON.parse(localStorage.getItem("usuario"));
    if (usuario) {
        document.getElementById("authSection").innerHTML = `
            <span style="margin-right:12px;color:#4a6b6b;">👤 ${usuario.nombre}</span>
            <button class="btn-outline" onclick="localStorage.removeItem('usuario');location.reload()">Cerrar sesión</button>
        `;
    }
})();
</script>

<form class="form-container" onsubmit="return registro(event)">
    <h2>Crear cuenta</h2>
    <p class="sub">Únete a la comunidad Water Seven</p>

    <input type="text" id="nombre" placeholder="Nombre completo" required>
    <input type="email" id="correo" placeholder="Correo electrónico" required>
    <input type="password" id="password" placeholder="Contraseña" required>

    <div id="reg-error" style="color:#d32f2f;font-size:13px;margin-bottom:12px;display:none;text-align:center;"></div>

    <button type="submit">Registrarse</button>
</form>

<script src="js/api.js"></script>
<script>
async function registro(event) {
    event.preventDefault();
    const nombre = document.getElementById("nombre").value;
    const correo = document.getElementById("correo").value;
    const password = document.getElementById("password").value;
    const errorDiv = document.getElementById("reg-error");

    try {
        const res = await api.registro(nombre, correo, password);

        if (res.error) {
            errorDiv.textContent = res.error;
            errorDiv.style.display = "block";
        } else {
            alert(res.mensaje);
            window.location.href = "login.html";
        }
    } catch (e) {
        errorDiv.textContent = "Error de conexión con el servidor";
        errorDiv.style.display = "block";
    }
}

(function(){
    const usuario = JSON.parse(localStorage.getItem("usuario"));
    if (usuario) window.location.href = "index.html";
})();
</script>
</body>
</html>
